<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
}

/* ===============================
   LOGIN
================================ */

.login-card{
  width:380px;
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
  text-align:center;
}

.logo{
  font-size:60px;
  margin-bottom:15px;
}

.login-card h2{
  margin-bottom:10px;
  color:#2563eb;
}

.login-card p{
  margin-bottom:25px;
  color:#666;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  transition:.3s;
}

button:hover{
  background:#1d4ed8;
}

#pesan{
  margin-top:15px;
  color:red;
  font-weight:bold;
}

/* ===============================
   DASHBOARD LAYOUT
================================ */

.dashboard{
  display:flex;
  width:100%;
  height:100vh;
}

/* Sidebar tetap (fixed) di kiri layar -- SATU-SATUNYA definisi, tidak ada duplikat lagi */
.sidebar{
  width:260px;
  background:#223a8f;
  color:white;
  padding:20px;
  height:100vh;
  overflow-y:auto;
  position:fixed;
  left:0;
  top:0;
}

.brand{
  text-align:center;
  margin-bottom:30px;
}

.brand h2{
  margin-top:10px;
}

.menu{
  list-style:none;
  padding:0;
}

.menu li{
  padding:15px;
  border-radius:10px;
  margin-bottom:8px;
  cursor:pointer;
  transition:.3s;
}

.menu li:hover,
.menu .active{
  background:#2563eb;
}

/* Konten utama -- diberi jarak kiri supaya tidak ketiban sidebar yang fixed */
.content{
  flex:1;
  margin-left:260px;
  padding:25px;
  background:#f3f4f6;
  overflow:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

/* Satu-satunya definisi .card, sudah digabung dari 2 versi lama yang identik */
.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.card h2{
  margin-top:10px;
  color:#2563eb;
  font-size:35px;
}

.welcome{
  margin-top:30px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}

/* ===============================
   MODAL
================================ */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-content{
  background:#fff;
  padding:20px;
  width:420px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.modal-content input,
.modal-content textarea,
.modal-content select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

.modal-actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
}

/* ===============================
   TABEL PENDUDUK
================================ */

#tblPenduduk{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

#tblPenduduk th,
#tblPenduduk td{
  border:1px solid #ddd;
  padding:10px;
  text-align:left;
}

#tblPenduduk th{
  background:#2563eb;
  color:white;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

</style>
