<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

html, body{
  min-height:100vh;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
}

/* ===============================
   LOGIN

================================ */

.login-container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-card{
  width:380px;
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
  text-align:center;
}

.logo{
  font-size:60px;
  margin-bottom:15px;
}

.login-card h2{
  margin-bottom:10px;
  color:#2563eb;
}

.login-card p{
  margin-bottom:25px;
  color:#666;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  transition:.3s;
}

button:hover{
  background:#1d4ed8;
}

#pesan{
  margin-top:15px;
  color:red;
  font-weight:bold;
}

/* ===============================
   DASHBOARD
   Sekarang bebas melebar penuh, tidak lagi kena
   pengaruh centering dari body.
================================ */

.dashboard{
  display:flex;
  width:100%;
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:250px;
  height:100vh;
  background:#233d91;
  color:#fff;
  overflow:auto;
}

.brand{
  padding:30px;
  text-align:center;
}

.brand h2{
  margin-top:10px;
}

.menu{
  list-style:none;
}

.menu li{
  padding:16px 25px;
  cursor:pointer;
  transition:.3s;
}

.menu li:hover,
.menu li.active{
  background:#2563eb;
}

.content{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
  background:#f3f5fa;
  padding:35px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:25px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
  color:#2563eb;
  margin-top:15px;
  font-size:35px;
}

.welcome{
  margin-top:25px;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* ===============================
   HALAMAN
================================ */

.page{
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.page-header button{
  background:#2563eb;
  color:#fff;
  padding:12px 30px;
  border-radius:8px;
  font-weight:bold;
  width:auto;
}

.page-header button:hover{
  background:#1d4ed8;
}

/* ===============================
   SEARCH
================================ */

#cariPenduduk{
  margin-bottom:18px;
}

/* ===============================
   TABLE
================================ */

table{
  width:100%;
  border-collapse:collapse;
}

table th{
  background:#2563eb;
  color:#fff;
  padding:14px;
  text-align:left;
}

table td{
  padding:14px;
  border-bottom:1px solid #ddd;
  vertical-align:middle;
}

table tr:nth-child(even){
  background:#fafafa;
}

table tr:hover{
  background:#f2f7ff;
}

/* Batasi lebar kolom Alamat supaya tidak melebar berlebihan */
#tblPenduduk td:nth-child(4){
  max-width:250px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

td:last-child{
  width:180px;
}

.aksi{
  display:flex;
  gap:8px;
}

.btn-edit{
  background:#f59e0b;
  color:white;
  padding:8px 16px;
  border-radius:8px;
  width:auto;
}

.btn-edit:hover{
  background:#d97706;
}

.btn-hapus{
  background:#ef4444;
  color:white;
  padding:8px 16px;
  border-radius:8px;
  width:auto;
}

.btn-hapus:hover{
  background:#dc2626;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
    overflow:auto;

    z-index:999;
}

.modal-content{

    background:#fff;

    width:650px;
    max-width:95%;

    border-radius:15px;

    padding:30px;

    box-shadow:0 20px 40px rgba(0,0,0,.18);

}

.modal-content h3{

    font-size:28px;

    color:#233d91;

    margin-bottom:25px;

}

/* semua input */

.modal-content input,
.modal-content select{

    width:100%;
    height:45px;

    padding:0 15px;

    margin-bottom:15px;

    border:1px solid #d9d9d9;

    border-radius:10px;

    font-size:15px;

    transition:.2s;

    background:#fff;

}

/* focus */

.modal-content input:focus,
.modal-content select:focus{

    outline:none;

    border-color:#2563eb;

    box-shadow:0 0 6px rgba(37,99,235,.25);

}
/* tombol */

.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:12px;

    margin-top:10px;

}

.modal-actions button{

    width:140px;

    height:45px;

    border:none;

    border-radius:10px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

}

.modal-actions button:first-child{

    background:#2563eb;

    color:white;

}

.modal-actions button:first-child:hover{

    background:#1d4ed8;

}

.modal-actions button:last-child{

    background:#ef4444;

    color:white;

}

.modal-actions button:last-child:hover{

    background:#dc2626;

}

  /* =========================================================
   UNIVERSAL TABLE STYLE
   Berlaku untuk semua halaman data
========================================================= */

.page{
    width:100%;
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.page-header h2{
    color:#233d91;
    font-size:28px;
    font-weight:700;
}

.page-header button{
    width:auto;
    padding:12px 24px;
    border-radius:10px;
    font-weight:600;
}

/* =========================
SEARCH
========================= */

#cariPenduduk,
#cariKK,
#cariSuratMasuk,
#cariSuratKeluar,
#cariPengaduan{

    width:100%;
    height:45px;

    margin-bottom:20px;

}

/* =========================
TABLE
========================= */

table{

    width:100%;
    border-collapse:collapse;

    background:#fff;

}

table thead{

    background:#2563eb;
    color:white;

}

table th{

    padding:14px;
    font-size:15px;
    text-align:left;

}

table td{

    padding:13px;
    border-bottom:1px solid #ececec;

}

table tbody tr:nth-child(even){

    background:#fafafa;

}

table tbody tr:hover{

    background:#edf4ff;

}

/* =========================
ACTION BUTTON
========================= */

.action-group{

    display:flex;
    gap:8px;
    justify-content:center;

}

.btn-edit{

    width:auto;

    background:#f59e0b;

    padding:8px 16px;

    border-radius:8px;

}

.btn-edit:hover{

    background:#d97706;

}

.btn-hapus{

    width:auto;

    background:#ef4444;

    padding:8px 16px;

    border-radius:8px;

}

.btn-hapus:hover{

    background:#dc2626;

}

.btn-detail{

    width:auto;

    background:#10b981;

    padding:8px 16px;

    border-radius:8px;

}

.btn-detail:hover{

    background:#059669;

}

/* =========================
MODAL FORM
========================= */

.modal-content input,
.modal-content select{

    width:100%;
    height:45px;

    padding:0 15px;

    margin-bottom:15px;

}

.modal-content input:focus,
.modal-content select:focus{

    border:1px solid #2563eb;
    box-shadow:0 0 5px rgba(37,99,235,.3);

}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

.sidebar{

    width:220px;

}

.content{

    margin-left:220px;

}

}

@media(max-width:700px){

.sidebar{

    width:100%;
    position:relative;
    height:auto;

}

.content{

    margin-left:0;
    width:100%;

}

.cards{

    grid-template-columns:1fr;

}

.page-header{

    flex-direction:column;
    align-items:flex-start;
    gap:15px;

}

.modal-content{

    width:95%;

}

}
  
</style>
