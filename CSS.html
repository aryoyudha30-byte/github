<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fb;
}

/* ===========================
LOGIN
=========================== */

.login-card{
    width:380px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.logo{
    font-size:60px;
    text-align:center;
}

.login-card h2{
    text-align:center;
    color:#2563eb;
    margin:15px 0;
}

.login-card p{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    font-size:15px;
}

button{
    cursor:pointer;
    border:none;
    transition:.3s;
}

/* ===========================
DASHBOARD
=========================== */

.dashboard{
    display:flex;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#233d91;
    color:#fff;
    overflow:auto;
}

.brand{
    padding:30px;
    text-align:center;
}

.brand h2{
    margin-top:10px;
}

.menu{
    list-style:none;
}

.menu li{
    padding:16px 25px;
    cursor:pointer;
    transition:.3s;
}

.menu li:hover,
.menu li.active{
    background:#2563eb;
}

.content{
    margin-left:250px;
    width:calc(100% - 250px);
    min-height:100vh;
    background:#f3f5fa;
    padding:35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
    color:#2563eb;
    margin-top:15px;
    font-size:35px;
}

.welcome{
    margin-top:25px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* ===========================
HALAMAN
=========================== */

.page{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.page-header button{
    background:#2563eb;
    color:#fff;
    padding:12px 30px;
    border-radius:8px;
    font-weight:bold;
}

.page-header button:hover{
    background:#1d4ed8;
}

/* ===========================
SEARCH
=========================== */

#cariPenduduk{
    margin-bottom:18px;
}

/* ===========================
TABLE
=========================== */

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#2563eb;
    color:#fff;
    padding:14px;
    text-align:left;
}

table td{
    padding:14px;
    border-bottom:1px solid #ddd;
    vertical-align:middle;
}

table tr:nth-child(even){
    background:#fafafa;
}

table tr:hover{
    background:#f2f7ff;
}

/* ===========================
BATASI KOLOM ALAMAT
=========================== */

#tblPenduduk td:nth-child(5){
    max-width:250px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* ===========================
AKSI
=========================== */

td:last-child{
    width:180px;
}

.aksi{
    display:flex;
    gap:8px;
}

.btn-edit{
    background:#f59e0b;
    color:white;
    padding:8px 16px;
    border-radius:8px;
}

.btn-edit:hover{
    background:#d97706;
}

.btn-hapus{
    background:#ef4444;
    color:white;
    padding:8px 16px;
    border-radius:8px;
}

.btn-hapus:hover{
    background:#dc2626;
}

/* ===========================
MODAL
=========================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    width:450px;
    background:#fff;
    border-radius:12px;
    padding:25px;
}

.modal-content h3{
    margin-bottom:20px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:15px;
}

.modal-actions button{
    width:auto;
    padding:10px 20px;
}

.modal-actions button:first-child{
    background:#2563eb;
    color:white;
}

.modal-actions button:last-child{
    background:#ef4444;
    color:white;
}

</style>
