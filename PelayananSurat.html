<div class="page">
  <div class="page-header">
    <h2>📝 Pelayanan Surat</h2>
    <button onclick="showFormPelayanan()">➕ Tambah Permohonan</button>
  </div>

  <input type="text" id="cariPelayanan"
    placeholder="Cari NIK, Nama atau Jenis Surat..."
    onkeyup="cariPelayanan()">

  <table id="tblPelayanan">
    <thead>
      <tr>
        <th>No Permohonan</th>
        <th>Tanggal</th>
        <th>NIK</th>
        <th>Nama</th>
        <th>Jenis Surat</th>
        <th>Status</th>
        <th>File</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div id="modalPelayanan" class="modal" style="display:none;">
<div class="modal-content">
<h3 id="judulModalPelayanan">Tambah Permohonan</h3>

<input type="hidden" id="pelayananId">
<input type="hidden" id="filePelayananExisting">

<label>NIK</label>
<input id="nikPelayanan" placeholder="NIK Pemohon">

<label>Nama</label>
<input id="namaPelayanan" placeholder="Nama Lengkap">

<label>Jenis Surat</label>
<select id="jenisSurat">
  <option value="Surat Domisili">Surat Domisili</option>
  <option value="Surat Keterangan Tidak Mampu">Surat Keterangan Tidak Mampu</option>
  <option value="Surat Pengantar">Surat Pengantar</option>
  <option value="Surat Usaha">Surat Usaha</option>
  <option value="Surat Kelahiran">Surat Kelahiran</option>
  <option value="Surat Kematian">Surat Kematian</option>
  <option value="Lainnya">Lainnya</option>
</select>

<label>Keperluan</label>
<input id="keperluan" placeholder="Keperluan pengajuan surat">

<label>Tanggal</label>
<input type="date" id="tanggalPelayanan">

<label>Keterangan</label>
<input id="keteranganPelayanan" placeholder="Keterangan tambahan">

<label>Status</label>
<select id="statusPelayanan">
  <option value="Menunggu">Menunggu</option>
  <option value="Diproses">Diproses</option>
  <option value="Selesai">Selesai</option>
  <option value="Ditolak">Ditolak</option>
</select>

<label>Petugas</label>
<input type="text" id="petugasPelayanan" placeholder="Nama petugas yang menangani">

<label>No HP</label>
<input type="text" id="noHpPelayanan" placeholder="08xxxxxxxxxx">

<label>Lampiran (persyaratan/scan dokumen)</label>
<input type="file" id="filePelayanan" accept=".pdf,.jpg,.jpeg,.png">
<small id="infoFilePelayanan" style="display:block; margin-bottom:10px; color:#666;"></small>

<div class="modal-actions">
<button id="btnSimpanPelayanan" onclick="simpanPelayanan(this)">💾 Simpan</button>
<button onclick="tutupModalPelayanan()">❌ Batal</button>
</div>

</div>
</div>
