<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🏛️
        </div>

        <h2>Sistem Administrasi Desa</h2>

        <p>Silakan login untuk melanjutkan</p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <div class="password-wrapper">
            <input
                type="password"
                id="password"
                placeholder="Password">
            <span id="togglePassword" onclick="togglePasswordVisibility()">👁️</span>
        </div>

        <button onclick="login()">
            LOGIN
        </button>

        <div id="pesan"></div>

    </div>

</div>

<style>
.password-wrapper {
    position: relative;
}
.password-wrapper input {
    width: 100%;
    box-sizing: border-box;
    padding-right: 40px;
}
#togglePassword {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    user-select: none;
    font-size: 18px;
}
</style>
