<script>

// Menyimpan token sesi login selama halaman dibuka (hilang otomatis kalau di-refresh -> harus login ulang)
let SESSION_TOKEN = null;

// ===============================
// MENU AKTIF
// ===============================

function setActiveMenu(menuId){
  document
    .querySelectorAll(".menu li")
    .forEach(li => li.classList.remove("active"));

  const menu = document.getElementById(menuId);
  if(menu){
    menu.classList.add("active");
  }
}

// ===============================
// LOGIN & PASSWORD TOGGLE
// ===============================

function togglePasswordVisibility(){
  const pwd = document.getElementById("password");
  const icon = document.getElementById("togglePassword");
  if (pwd.type === "password") {
    pwd.type = "text";
    icon.textContent = "🙈";
  } else {
    pwd.type = "password";
    icon.textContent = "👁️";
  }
}

function login(){
  let username = document.getElementById("username").value;
  let password = document.getElementById("password").value;

  google.script.run
    .withSuccessHandler(function(result){
      if (result.success) {
        SESSION_TOKEN = result.token;

        google.script.run
          .withSuccessHandler(function(html){
            document.getElementById("app").innerHTML = html;
            const tanggal = document.getElementById("tanggal");
            if (tanggal) {
              tanggal.innerHTML = new Date().toLocaleDateString("id-ID");
            }
            loadDashboard();
            loadAktivitasTerbaru();
          })
          .getDashboard();

      } else {
        document.getElementById("pesan").innerHTML = result.message;
      }
    })
    .withFailureHandler(function(err){
      document.getElementById("pesan").innerHTML = "Terjadi kesalahan: " + err.message;
    })
    .checkLogin(username, password);
}

function logout(){
  SESSION_TOKEN = null;
  location.reload();
}

// ===============================
// DASHBOARD
// ===============================

function loadDashboard(){
  google.script.run
    .withSuccessHandler(function(data){
      document.getElementById("totalPenduduk").innerText = data.penduduk;
      document.getElementById("totalKK").innerText = data.kk;
      document.getElementById("totalSuratMasuk").innerText = data.suratMasuk;
      document.getElementById("totalSuratKeluar").innerText = data.suratKeluar;
      document.getElementById("totalPengaduan").innerText = data.pengaduan;
      document.getElementById("totalAgenda").innerText = data.agenda;
    })
    .withFailureHandler(function(err){
      console.error("Gagal memuat dashboard:", err.message);
    })
    .getDashboardStats();
}

function loadAktivitasTerbaru(){
  google.script.run
    .withSuccessHandler(function(list){
      const ul = document.getElementById("aktivitasTerbaru");
      if (!ul) return;

      if (!list || list.length === 0) {
        ul.innerHTML = "<li>Belum ada aktivitas.</li>";
        return;
      }

      ul.innerHTML = list.map(item =>
        `<li>${item.username} - ${item.aksi} (${new Date(item.waktu).toLocaleString("id-ID")})</li>`
      ).join("");
    })
    .withFailureHandler(function(err){
      console.error("Gagal memuat aktivitas:", err.message);
    })
    .getAktivitasTerbaru(SESSION_TOKEN);
}

// ===============================
// PENDUDUK
// ===============================

function showPenduduk(){
  setActiveMenu("menuPenduduk");
  google.script.run
    .withSuccessHandler(function(html){
      document.getElementById("content").innerHTML = html;
      loadPenduduk();
    })
    .getPendudukPage();
}

function showDashboard(){
  setActiveMenu("menuDashboard");
  google.script.run
    .withSuccessHandler(function(html){
      document.getElementById("app").innerHTML = html;
      loadDashboard();
      loadAktivitasTerbaru();
    })
    .getDashboard();
}

// Menyimpan sementara data terakhir yang diambil, supaya tombol Edit
// tidak perlu memanggil server lagi hanya untuk mengisi form
let DATA_PENDUDUK_TERAKHIR = [];

function loadPenduduk(){
  google.script.run
    .withSuccessHandler(function(data){
      DATA_PENDUDUK_TERAKHIR = data;

      let html = "";
      for (let i = 1; i < data.length; i++) {
        // data[i]: [ID, NIK, NAME, JK, TEMPAT, TANGGAL, ALAMAT, RT, RW, HP]
        html += `
          <tr>
            <td>${data[i][1]}</td>
            <td>${data[i][2]}</td>
            <td>${data[i][3]}</td>
            <td>${data[i][6]}</td>
            <td>
              <button onclick="editPenduduk('${data[i][0]}')">✏️ Edit</button>
              <button onclick="hapusPenduduk('${data[i][0]}')">🗑️ Hapus</button>
            </td>
          </tr>`;
      }
      document.querySelector("#tblPenduduk tbody").innerHTML = html;
    })
    .withFailureHandler(function(err){
      alert("Gagal memuat data Penduduk: " + err.message);
    })
    .getPenduduk(SESSION_TOKEN);
}

function showFormPenduduk(){
  // Pastikan form dalam mode "Tambah" (bukan sisa mode Edit sebelumnya)
  document.getElementById("judulModalPenduduk").innerText = "Tambah Penduduk";
  document.getElementById("pendudukId").value = "";
  document.getElementById("nik").value = "";
  document.getElementById("nama").value = "";
  document.getElementById("jk").value = "Laki-laki";
  document.getElementById("tempat").value = "";
  document.getElementById("tgl").value = "";
  document.getElementById("alamat").value = "";
  document.getElementById("rt").value = "";
  document.getElementById("rw").value = "";
  document.getElementById("hp").value = "";

  document.getElementById("modalPenduduk").style.display = "flex";
}

function editPenduduk(id){
  // Cari data barisnya dari data yang sudah dimuat sebelumnya
  const row = DATA_PENDUDUK_TERAKHIR.find(r => r[0].toString() === id.toString());
  if (!row) {
    alert("Data tidak ditemukan, coba muat ulang halaman.");
    return;
  }

  document.getElementById("judulModalPenduduk").innerText = "Edit Penduduk";
  document.getElementById("pendudukId").value = row[0];
  document.getElementById("nik").value = row[1];
  document.getElementById("nama").value = row[2];
  document.getElementById("jk").value = row[3];
  document.getElementById("tempat").value = row[4];
  document.getElementById("tgl").value = formatTanggalUntukInput(row[5]);
  document.getElementById("alamat").value = row[6];
  document.getElementById("rt").value = row[7];
  document.getElementById("rw").value = row[8];
  document.getElementById("hp").value = row[9];

  document.getElementById("modalPenduduk").style.display = "flex";
}

// Input type="date" butuh format YYYY-MM-DD, sedangkan data tersimpan dd/MM/yyyy.
// Fungsi ini mengubah dd/MM/yyyy -> YYYY-MM-DD supaya field tanggal terisi otomatis saat Edit.
function formatTanggalUntukInput(tgl){
  if (!tgl) return "";
  const parts = tgl.toString().split("/");
  if (parts.length !== 3) return tgl; // sudah dalam format lain, biarkan apa adanya
  const [dd, mm, yyyy] = parts;
  return `${yyyy}-${mm}-${dd}`;
}

function tutupModalPenduduk(){
  document.getElementById("modalPenduduk").style.display = "none";
}

function simpanPenduduk(){
  const id = document.getElementById("pendudukId").value;

  const data = {
    nik: document.getElementById("nik").value,
    nama: document.getElementById("nama").value,
    jk: document.getElementById("jk").value,
    tempat: document.getElementById("tempat").value,
    tgl: document.getElementById("tgl").value,
    alamat: document.getElementById("alamat").value,
    rt: document.getElementById("rt").value,
    rw: document.getElementById("rw").value,
    hp: document.getElementById("hp").value
  };

  if (id) {
    // Mode EDIT: ada ID tersimpan di form -> panggil fungsi update
    google.script.run
      .withSuccessHandler(function(){
        alert("Data berhasil diperbarui");
        tutupModalPenduduk();
        loadPenduduk();
        loadDashboard();
      })
      .withFailureHandler(function(err){
        alert("Gagal memperbarui data: " + err.message);
      })
      .editPenduduk(SESSION_TOKEN, id, data);
  } else {
    // Mode TAMBAH: tidak ada ID -> data baru
    google.script.run
      .withSuccessHandler(function(){
        alert("Data berhasil disimpan");
        tutupModalPenduduk();
        loadPenduduk();
        loadDashboard();
      })
      .withFailureHandler(function(err){
        alert("Gagal menyimpan data: " + err.message);
      })
      .tambahPenduduk(SESSION_TOKEN, data);
  }
}

function hapusPenduduk(id){
  if(confirm("Yakin ingin menghapus data ini?")){
    google.script.run
      .withSuccessHandler(function(){
        loadPenduduk();
        loadDashboard();
      })
      .withFailureHandler(function(err){
        alert("Gagal menghapus data: " + err.message);
      })
      .hapusPenduduk(SESSION_TOKEN, id);
  }
}

function cariPenduduk(){
  const keyword = document.getElementById("cariPenduduk").value.toLowerCase();
  const rows = document.querySelectorAll("#tblPenduduk tbody tr");

  rows.forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(keyword)
      ? ""
      : "none";
  });
}

</script>
